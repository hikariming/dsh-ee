<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>dsh-ee · 企业 DSH 插件市场</title>
    <script>
      // 首屏先落主题再渲染，避免刷新时闪一下浅色。逻辑与 src/lib/theme.ts 保持一致。
      (function () {
        try {
          // 宿主 iframe 用 ?embed=1&theme=light|dark|system 指定主题：只作用于本次页面，不写回 localStorage。
          // system 跟随系统 prefers-color-scheme（后续变化由 src/lib/use-embed.ts 的 useEmbedTheme 处理）。
          var params = new URLSearchParams(window.location.search);
          var embed = params.get("embed") === "1";
          var forced = embed ? params.get("theme") : null;
          var mode =
            forced === "light" || forced === "dark" || forced === "system"
              ? forced
              : localStorage.getItem("dsh-ee:theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage 被禁用时按浅色起步 */
        }
      })();
      // 首屏语言与标题：与 src/i18n/langs.ts 的检测规则一致（localStorage → navigator，
      // zh*→zh-CN，其它→en），只改 DOM、不写 localStorage；路由切换后的标题交给 P2。
      // 加新语言时这里要补「语言码 + 英文/母语标题」的映射（见 web/src/i18n/README.md）。
      (function () {
        try {
          var stored = localStorage.getItem("dsh-ee:lang");
          var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
          var tag = String(stored || nav).toLowerCase();
          var lang = tag.indexOf("zh") === 0 ? "zh-CN" : "en";
          document.documentElement.lang = lang;
          // 中文标题就是上面静态 <title> 里的原文；非中文先显示英文标题，避免首屏闪中文。
          if (lang !== "zh-CN") document.title = "dsh-ee · Enterprise DSH plugin hub";
        } catch (e) {
          /* 读不到 localStorage / navigator 时保持静态中文标题 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

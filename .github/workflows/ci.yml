name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TIDB_IMAGE: pingcap/tidb:v8.5.8

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: corepack enable
      # docs/ 是站内 /docs 的单一事实源：web/src/generated/dev-docs.ts 必须与 docs/ 同步
      # （改了文档要重新生成并提交）；生成器和测试只用 Node 内置模块，不需要先装依赖。
      - name: 校验站内文档生成物
        run: |
          node scripts/docs/build.mjs --check
          node --experimental-strip-types --test scripts/docs/build.test.mjs
      - run: pnpm install --frozen-lockfile
        working-directory: web
      # tsc + vite build；缺英文翻译的键会在这里报错
      - run: pnpm build
        working-directory: web
      - run: npm ci --no-audit --no-fund
        working-directory: dsh-plugin
      - run: npm test
        working-directory: dsh-plugin
      - run: npm run build
        working-directory: dsh-plugin
      - run: git diff --exit-code server/internal/api/connectpkg/index.js
      # 端侧扩展 SDK、端侧模板和 Claude Code 适配器（docs/plugins.md §8、§10）
      # SDK 是可发布 npm 包：dry-run 检查打包内容（prepack 会先构建 dist/）
      - run: npm ci --no-audit --no-fund && npm test && npm run build && npm pack --dry-run
        working-directory: extensions/sdk-local
      # 模板的 package.json 依赖 @dsh-ee/extension-local 的包名 + 版本（和真实用户一样）；
      # SDK 还没发布到 npm 时，CI 把依赖临时换成上一步构建出的本地目录再装。模板不提交 lockfile，
      # 以免把仓库里的相对路径写进模板。
      - run: |
          npm pkg set 'dependencies.@dsh-ee/extension-local=file:../../sdk-local'
          npm install --no-audit --no-fund --omit=optional
          npm test
        working-directory: extensions/official/legacy-local
      - run: node --test test/*.test.mjs
        working-directory: extensions/official/claude-code
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # 相对链接/锚点、上游 pin 表、docs/dev front matter；只读，不需要安装依赖
      - run: node scripts/check-docs.mjs

  server:
    runs-on: ubuntu-latest
    services:
      tidb:
        image: pingcap/tidb:v8.5.8
        ports: ["4000:4000"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: 等待 TiDB
        run: |
          for i in $(seq 1 60); do mysql -h127.0.0.1 -P4000 -uroot -e 'select 1' >/dev/null 2>&1 && exit 0; sleep 2; done
          echo "TiDB 没起来" && exit 1
      - run: go vet ./...
        working-directory: server
      - run: go test -count=1 -timeout=20m ./...
        working-directory: server
        env:
          DSH_EE_TEST_DSN: root:@tcp(127.0.0.1:4000)/
      # #59 的 ee_jwt 适配层是独立 Go module，server job 默认不会编译它。
      - name: vet ee_jwt adapter example
        working-directory: extensions/official/ee-jwt-adapter
        run: go vet ./...
      - name: build ee_jwt adapter example
        working-directory: extensions/official/ee-jwt-adapter
        run: go build -o /tmp/ee-jwt-adapter .
      # 服务扩展的 Go SDK 和示例也是独立 module
      - name: test Go extension SDK
        working-directory: extensions/sdk-go
        run: go vet ./... && go test -count=1 ./...
      - name: build demo service extension
        working-directory: extensions/examples/demo-extension
        run: go vet ./... && go build -o /tmp/demo-extension .

  e2e:
    needs: web
    runs-on: ubuntu-latest
    services:
      tidb:
        image: pingcap/tidb:v8.5.8
        ports: ["4000:4000"]
    env:
      ADMIN_PW: e2e-admin-password-1
      E2E_BASE: http://127.0.0.1:8080
      E2E_MANAGED: "1"
      E2E_BIN: ${{ github.workspace }}/dist/dsh-ee
      E2E_DSN: root:@tcp(127.0.0.1:4000)/
      CHROME: /usr/bin/google-chrome
      # 跨站嵌入 e2e（35-embed-v1）：宿主页起在 http://localhost:8099，与 127.0.0.1 不同站
      DSH_EE_EMBED_CROSS_SITE: "1"
      DSH_EE_EMBED_ORIGINS: http://localhost:8099
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/internal/webui/build
      - name: 构建单文件服务端
        working-directory: server
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=${GITHUB_SHA::8}" -o ../dist/dsh-ee ./cmd/dsh-ee
      - name: 等待 TiDB
        run: |
          for i in $(seq 1 60); do mysql -h127.0.0.1 -P4000 -uroot -e 'select 1' >/dev/null 2>&1 && exit 0; sleep 2; done
          exit 1
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - run: node run.mjs
        working-directory: e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: e2e/shots
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 校验 compose 文件
        working-directory: deploy
        run: |
          printf 'DSH_EE_SECRET_KEY=x\nOB_TENANT_PASSWORD=x\nOB_SYS_PASSWORD=x\n' > .env
          docker compose -f compose.yml config -q
          docker compose -f compose.yml -f compose.tidb.yml config -q
          docker compose -f compose.yml -f compose.oceanbase.yml config -q
          sh -n install.sh
      - name: 构建镜像
        run: docker build --build-arg VERSION="${GITHUB_SHA::8}" -t dsh-ee:ci .
      - name: 镜像能启动（不连数据库，只看配置校验）
        run: |
          out="$(docker run --rm dsh-ee:ci version)"
          echo "$out" && test "$out" = "${GITHUB_SHA::8}"

  sdk:
    # 第三方 Harness SDK（sdk/typescript + sdk/python）独立 job，不参与 server/e2e 主链。
    # TS：构建 / 类型检查 / mock fetch 单测 / npm pack 内容；Python：unittest / 编译检查 / wheel 构建。
    # 发布工作流与包元数据检查只读，不发布（release-sdk.yml 仅手动/tag 触发）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: TypeScript SDK（build / typecheck / test / pack）
        working-directory: sdk/typescript
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run typecheck
          npm test
          npm pack --dry-run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python SDK（unittest / compileall / wheel）
        working-directory: sdk/python
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q dsh_ee_harness tests
          python3 -m pip wheel --no-deps -w /tmp/sdk-python-wheel .
          ls /tmp/sdk-python-wheel
      - name: SDK 发布脚本 / 发布工作流 / 包元数据校验（不发布）
        run: |
          node --test scripts/sdk/*.test.mjs
          node scripts/sdk/verify-release-workflow.mjs
          node scripts/sdk/verify-package.mjs --package typescript
          node scripts/sdk/verify-package.mjs --package python
